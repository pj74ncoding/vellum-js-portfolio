<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Success Animation</title>
    <script
      src="https://kit.fontawesome.com/6644687a4d.js"
      crossorigin="anonymous"
    ></script>
    <!-- loads the entire Variable Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..50,100..700,0..1,-50..200&icon_names=favorite,home,search,settings"
      rel="stylesheet"
    />
  </head>

  <body class="body-basics">
    <style>
      .body-basics {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: -1;
      }
      .container-basics {
        width: 400px;
        height: 220px;
        border: 1px solid black;
        border-radius: 8px;
        position: relative;
        z-index: 0;
      }

      .icon-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0px 20px;
        position: relative;
      }

      .icon-container-animation {
        display: flex;
        align-items: center;
        justify-content: end;
        padding: 0px 20px;
        position: relative;
      }

      .icon-container-central {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0px 20px;
        position: relative;
        transition: all 3s ease-in-out;
      }

      .open-book {
        position: absolute;
        right: 17px;
      }

      .page-animation {
        position: relative;
        z-index: 1;
        transform: translateX(350px);
        transition: all 3s ease-in-out;
      }

      .open-book-display {
        display: none;
      }

      .closed-book {
        transition: all 3s ease-in-out;
      }
      .closed-book-display {
        display: none;
      }
      .success-message-displayed {
        display: none;
      }

      .success-message {
        color: green;
      }
    </style>

    <div id="animation-container" class="icon-container container-basics">
      <img id="page-icon" src="page.png" alt="" />
      <img id="open-book" class="open-book" src="open-book-2.png" alt="" />
      <img
        id="closed-book"
        class="closed-book closed-book-display"
        src="closed-book.png"
        alt=""
      />
      <h3
        id="success-message"
        class="success-message-displayed success-message"
      >
        Success Your Entry Has Been Added!!
      </h3>
    </div>
    <button onclick="saveEntryAnimation()">click</button>
    <script>
      const animationContainer = document.getElementById("animation-container");
      const page = document.getElementById("page-icon");
      const openBook = document.getElementById("open-book");
      const closedBook = document.getElementById("closed-book");
      const successMessage = document.getElementById("success-message");
      function saveEntryAnimation() {
        page.classList.add("page-animation");
        setTimeout(() => {
          openBook.classList.add("open-book-display");
          page.classList.add("open-book-display");
        }, 3000);
        setTimeout(() => {
          animationContainer.classList.remove("icon-container");
          animationContainer.classList.add("icon-container-animation");

          closedBook.classList.remove("closed-book-display");
        }, 3000);
        setTimeout(() => {
          animationContainer.classList.add("icon-container-central");
          animationContainer.classList.remove("icon-container-animation");
          successMessage.classList.remove("success-message-displayed");
        }, 3500);
      }
    </script>
  </body>
</html>
